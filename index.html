        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            overscroll-behavior-y: none; 
        }

        .answer-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .answer-btn:active {
            transform: scale(0.96);
        }

        .btn-correct {
            background-color: #22c55e !important; 
            color: white !important;
            border-color: #16a34a !important; 
            transform: scale(1.02);
            box-shadow: 0 10px 15px -3px rgba(34, 197, 94, 0.3);
        }

        .btn-wrong {
            background-color: #ef4444 !important; 
            color: white !important;
            border-color: #dc2626 !important; 
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>
<body class="h-[100dvh] w-full flex justify-center items-center overflow-hidden text-slate-800">

        `;

        // Разделяем слова, учитывая, что дефис должен быть окружен пробелами (чтобы не разбить T-shirt)
        const words = rawWordsData.trim().split('\n').filter(line => line.includes(' - ')).map(line => {
            const parts = line.split(/\s+-\s+/);
            const en = parts[0].trim();
            const ru = parts[1].trim();
            const filename = en.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '') + '.mp3';
            return { en, ru, audio: `audio/${filename}` };
        });

        const STORAGE_KEY = 'english_game_data_v4'; // Версия с умным интервальным повторением
        
        let appData = {
            direction: 'en-ru', 
            mode: 'study', 
            scores: { 
                study: { 'en-ru': 0, 'ru-en': 0 }, 
                time: { 'en-ru': 0, 'ru-en': 0 } 
            },
            wordsPlayed: { 
                study: { 'en-ru': 0, 'ru-en': 0 }, 
                time: { 'en-ru': 0, 'ru-en': 0 } 
            },
            mistakes: {}, // Теперь это объект: { "hello": "2026-08-21" } - дата последней ошибки
            todayCorrect: { date: '', words: [] }, // Ошибки, исправленные СЕГОДНЯ (отложены до завтра)
            dailyStats: {} // 'YYYY-MM-DD': { study: { 'en-ru': {s, m}, 'ru-en': {s, m} }, time: ... }
        };

        let currentWord = null;
        let currentAnswers = [];
        let timerId = null;
        let isQuestionActive = false;
        let hasMistakeThisWord = false; 
        
        let currentStatMode = 'study'; 
        let currentStatDir = 'en-ru';
        let statOffsetDays = 0; 
        
        let lastPlayedWordEn = null; 
        
        const audioPlayer = new Audio();

        const screens = {
            start: document.getElementById('startScreen'),
            game: document.getElementById('gameScreen'),
            stats: document.getElementById('statsScreen')
        };
        
        const uiQuestion = document.getElementById('uiQuestion');
        const uiClickedTranslation = document.getElementById('uiClickedTranslation');
        const transText = document.getElementById('transText');
        const uiAnswers = document.getElementById('uiAnswers');
        const uiScore = document.getElementById('uiScore');
        const btnNextWord = document.getElementById('btnNextWord');
        const timerContainer = document.getElementById('timerContainer');
        const timerBar = document.getElementById('timerBar');

        function getTodayString() {
            const now = new Date();
            return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        }

        function initDailyStatObj(dateStr) {
            if (!appData.dailyStats[dateStr]) {
                appData.dailyStats[dateStr] = { 
                    study: { 'en-ru': { score: 0, mistakes: 0 }, 'ru-en': { score: 0, mistakes: 0 } }, 
                    time:  { 'en-ru': { score: 0, mistakes: 0 }, 'ru-en': { score: 0, mistakes: 0 } } 
                };
            }
        }

        function loadSettings() {
            try {
                let data = localStorage.getItem(STORAGE_KEY);
                
                if (!data) {
                    // Миграция со старых версий (v3)
                    const oldV3 = localStorage.getItem('english_game_data_v3');
                    if (oldV3) {
                        const parsed = JSON.parse(oldV3);
                        appData = { ...appData, ...parsed };
                        
                        // Если старые ошибки были в массиве, переделываем их в объект с "вчерашней" датой,
                        // чтобы они всплыли сегодня для закрепления.
                        if (Array.isArray(appData.mistakes)) {
                            let newMistakes = {};
                            let yesterday = new Date();
                            yesterday.setDate(yesterday.getDate() - 1);
                            let yStr = `${yesterday.getFullYear()}-${String(yesterday.getMonth() + 1).padStart(2, '0')}-${String(yesterday.getDate()).padStart(2, '0')}`;
                            
                            appData.mistakes.forEach(w => {
                                newMistakes[w] = yStr;
                            });
                            appData.mistakes = newMistakes;
                        }
                    }
                } else {
                    appData = { ...appData, ...JSON.parse(data) };
                }
                
                // Проверяем актуальность todayCorrect
                if (!appData.todayCorrect || appData.todayCorrect.date !== getTodayString()) {
                    appData.todayCorrect = { date: getTodayString(), words: [] };
                }
                
                initDailyStatObj(getTodayString());
                updateMenuButtons();
            } catch (e) { console.error("Error loading settings", e); }
        }

        function saveSettings() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
        }

        function recordDailyStat(type) { 
            const mode = appData.mode;
            const dir = appData.direction;
            const todayStr = getTodayString();
            initDailyStatObj(todayStr);
            
            if (type === 'score') {
                appData.scores[mode][dir]++;
                appData.wordsPlayed[mode][dir]++;
                appData.dailyStats[todayStr][mode][dir].score++;
            } else if (type === 'mistakes') {
                appData.dailyStats[todayStr][mode][dir].mistakes++;
            }
            saveSettings();
        }

        function updateInGameScore() {
            const todayStr = getTodayString();
            initDailyStatObj(todayStr);
            uiScore.textContent = appData.dailyStats[todayStr][appData.mode][appData.direction].score;
        }

        function showScreen(screenName) {
            Object.values(screens).forEach(s => {
                s.style.transform = 'translateX(100%)';
            });
            if (screenName === 'start') {
                screens.start.style.transform = 'translateX(0)';
            } else if (screenName === 'game') {
                screens.game.style.transform = 'translateX(0)';
            } else if (screenName === 'stats') {
                screens.stats.style.transform = 'translateX(0)';
            }
        }

        function shuffle(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function getNextWord() {
            // Выбираем из ошибок, исключая те, что уже правильно ответили СЕГОДНЯ, и только что сыгранное слово
            const availableMistakes = Object.keys(appData.mistakes).filter(w => 
                w !== lastPlayedWordEn && !appData.todayCorrect.words.includes(w)
            );
            
            // С вероятностью 30% даем слово на повторение (если есть что повторять)
            if (availableMistakes.length > 0 && Math.random() < 0.3) {
                const mistakeEn = availableMistakes[Math.floor(Math.random() * availableMistakes.length)];
                const word = words.find(w => w.en === mistakeEn);
                if (word) return word;
            }
            
            const availableWords = words.filter(w => w.en !== lastPlayedWordEn);
            return availableWords[Math.floor(Math.random() * availableWords.length)];
        }

        function getAnswers(correctWord) {
            const otherWords = words.filter(word => word.en !== correctWord.en);
            const randomWords = shuffle(otherWords).slice(0, 3);
            return shuffle([correctWord, ...randomWords]);
        }

        function playWordAudio(word) {
            audioPlayer.src = word.audio;
            audioPlayer.play().catch(e => console.log("Audio play prevented:", e));
        }

        function freezeTimer() {
            if (appData.mode === 'time' && timerBar) {
                const computedWidth = window.getComputedStyle(timerBar).width;
                timerBar.style.transition = 'none';
                timerBar.style.width = computedWidth;
            }
        }

        function newQuestion() {
            clearTimeout(timerId);
            isQuestionActive = true;
            hasMistakeThisWord = false; 
            btnNextWord.classList.add('hidden');
            uiAnswers.innerHTML = "";
            uiClickedTranslation.classList.add('opacity-0');
            
            currentWord = getNextWord();
            lastPlayedWordEn = currentWord.en; 
            currentAnswers = getAnswers(currentWord);
            
            if (appData.direction === 'en-ru') {
                uiQuestion.textContent = currentWord.en;
            } else {
                uiQuestion.textContent = currentWord.ru;
            }

            currentAnswers.forEach(word => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn bg-slate-50 border-2 border-slate-200 text-slate-700 font-semibold rounded-2xl p-4 text-lg w-full text-center hover:bg-slate-100 hover:border-slate-300';
                
                btn.textContent = (appData.direction === 'en-ru') ? word.ru : word.en;
                btn.onclick = () => handleAnswerClick(word, btn);
                uiAnswers.appendChild(btn);
            });

            if (appData.mode === 'time') {
                timerContainer.classList.remove('hidden');
                timerBar.style.transition = 'none';
                timerBar.style.width = '100%';
                
                void timerBar.offsetWidth; 
                
                timerBar.style.transition = 'width 5s linear';
                timerBar.style.width = '0%';

                timerId = setTimeout(() => {
                    handleTimeout();
                }, 5000);
            } else {
                timerContainer.classList.add('hidden');
            }
        }

        function handleAnswerClick(clickedWord, btnElement) {
            playWordAudio(clickedWord);
            
            transText.textContent = `${clickedWord.en} — ${clickedWord.ru}`;
            uiClickedTranslation.classList.remove('opacity-0');

            if (!isQuestionActive) return; 

            const isCorrect = clickedWord.en === currentWord.en;
            const todayStr = getTodayString();

            if (isCorrect) {
                isQuestionActive = false;
                clearTimeout(timerId); 
                freezeTimer();
                
                btnElement.classList.add('btn-correct');
                
                // ЛОГИКА ИНТЕРВАЛЬНОГО ПОВТОРЕНИЯ:
                if (appData.mistakes[currentWord.en]) {
                    if (appData.mistakes[currentWord.en] !== todayStr) {
                        // Ошибка была сделана в прошлые дни. Ребенок ответил верно -> удаляем насовсем.
                        delete appData.mistakes[currentWord.en];
                    } else {
                        // Ошибка была сделана СЕГОДНЯ. Добавляем в todayCorrect, чтобы больше не задавать СЕГОДНЯ.
                        // Но оставляем в базе ошибок, чтобы проверить ЗАВТРА.
                        if (!appData.todayCorrect.words.includes(currentWord.en)) {
                            appData.todayCorrect.words.push(currentWord.en);
                        }
                    }
                }
                
                recordDailyStat('score');
                updateInGameScore();
                showNextButton();
            } else {
                btnElement.classList.add('btn-wrong');
                
                if (!hasMistakeThisWord) {
                    hasMistakeThisWord = true;
                    recordDailyStat('mistakes');
                    
                    // Регистрируем ошибку сегодняшней датой
                    appData.mistakes[currentWord.en] = todayStr;
                    
                    // Если вдруг слово было в todayCorrect (допустим ответил правильно, а потом на другой попытке неверно) - убираем
                    appData.todayCorrect.words = appData.todayCorrect.words.filter(w => w !== currentWord.en);
                    saveSettings();
                }

                if (appData.mode === 'time') {
                    handleTimeout(); 
                }
            }
        }

        function handleTimeout() {
            if (!isQuestionActive) return;
            isQuestionActive = false;
            clearTimeout(timerId);
            freezeTimer();

            const todayStr = getTodayString();

            if (!hasMistakeThisWord) {
                hasMistakeThisWord = true;
                recordDailyStat('mistakes');
                
                appData.mistakes[currentWord.en] = todayStr;
                appData.todayCorrect.words = appData.todayCorrect.words.filter(w => w !== currentWord.en);
                saveSettings();
            }

            const buttons = uiAnswers.querySelectorAll('button');
            buttons.forEach((btn, wordIndex) => {
                if (currentAnswers[wordIndex] === currentWord) {
                    btn.classList.add('btn-correct');
                }
            });

            transText.textContent = `${currentWord.en} — ${currentWord.ru}`;
            uiClickedTranslation.classList.remove('opacity-0');
            playWordAudio(currentWord);
            showNextButton();
        }

        function showNextButton() {
            btnNextWord.classList.remove('hidden');
        }

        document.getElementById('btnPlaySound').onclick = () => {
            if (currentWord) playWordAudio(currentWord);
        };
        
        btnNextWord.onclick = newQuestion;

        document.getElementById('btnStartGame').onclick = () => {
            updateInGameScore();
            showScreen('game');
            newQuestion();
        };

        document.getElementById('btnBackToMenu').onclick = () => {
            clearTimeout(timerId);
            showScreen('start');
        };

        document.getElementById('btnBackFromStats').onclick = () => {
            showScreen('start');
        };

        function renderStats() {
            const toggleClasses = {
                active: 'flex-1 py-1.5 rounded-lg text-xs font-bold bg-white shadow-sm text-slate-800 transition',
                inactive: 'flex-1 py-1.5 rounded-lg text-xs font-bold text-slate-500 hover:text-slate-800 hover:bg-slate-200 transition'
            };

            document.getElementById('statToggleStudy').className = currentStatMode === 'study' ? toggleClasses.active : toggleClasses.inactive;
            document.getElementById('statToggleTime').className = currentStatMode === 'time' ? toggleClasses.active : toggleClasses.inactive;
            
            document.getElementById('statDirEnRu').className = currentStatDir === 'en-ru' ? toggleClasses.active : toggleClasses.inactive;
            document.getElementById('statDirRuEn').className = currentStatDir === 'ru-en' ? toggleClasses.active : toggleClasses.inactive;

            // Только одно главное число - история всех слов (совпадает со счетом для простоты)
            document.getElementById('statTotalWords').textContent = appData.wordsPlayed[currentStatMode][currentStatDir] || 0;
            
            // Построение графика
            const chartContainer = document.getElementById('chartContainer');
            chartContainer.innerHTML = '';
            
            const todayDate = new Date();
            const startOffset = statOffsetDays; 
            const endOffset = statOffsetDays + 6;
            
            const daysArr = [];
            for (let i = endOffset; i >= startOffset; i--) {
                const d = new Date(todayDate);
                d.setDate(todayDate.getDate() - i);
                daysArr.push(d);
            }
            
            if (statOffsetDays === 0) {
                document.getElementById('chartDateLabel').textContent = 'За последние 7 дней';
                document.getElementById('btnChartNext').classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                const d1 = daysArr[0].toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
                const d2 = daysArr[6].toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
                document.getElementById('chartDateLabel').textContent = `${d1} - ${d2}`;
                document.getElementById('btnChartNext').classList.remove('opacity-50', 'cursor-not-allowed');
            }
            
            let maxVal = 5;
            const chartData = daysArr.map(date => {
                const dateString = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
                initDailyStatObj(dateString);
                
                const dataForMode = appData.dailyStats[dateString][currentStatMode][currentStatDir];
                
                if (dataForMode.score > maxVal) maxVal = dataForMode.score;
                if (dataForMode.mistakes > maxVal) maxVal = dataForMode.mistakes;
                
                return { date, score: dataForMode.score, mistakes: dataForMode.mistakes };
            });
            
            chartData.forEach(data => {
                const col = document.createElement('div');
                col.className = 'flex flex-col items-center flex-1 justify-end h-full group relative cursor-default mx-0.5 sm:mx-1';
                
                const scoreHeight = (data.score / maxVal) * 100;
                const mistakesHeight = (data.mistakes / maxVal) * 100;
                const dateLabel = data.date.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
                
                col.innerHTML = `
                    <div class="absolute -top-10 text-[10px] leading-tight font-bold text-slate-700 opacity-0 group-hover:opacity-100 transition-opacity bg-white border border-slate-200 px-2 py-1 rounded shadow-md z-10 pointer-events-none whitespace-nowrap text-center">
                        <span class="text-green-600">Очки: ${data.score}</span><br>
                        <span class="text-red-500">Ошибки: ${data.mistakes}</span>
                    </div>
                    <div class="w-full flex items-end justify-center gap-0.5 h-full relative">
                        <div class="w-1/2 bg-green-100 rounded-t-sm relative overflow-hidden flex items-end justify-center" style="height: ${scoreHeight}%; min-height: 4px;">
                            <div class="w-full bg-green-500 opacity-80 group-hover:opacity-100 h-full transition-opacity"></div>
                        </div>
                        <div class="w-1/2 bg-red-100 rounded-t-sm relative overflow-hidden flex items-end justify-center" style="height: ${mistakesHeight}%; min-height: 4px;">
                            <div class="w-full bg-red-500 opacity-80 group-hover:opacity-100 h-full transition-opacity"></div>
                        </div>
                    </div>
                    <div class="text-[9px] sm:text-[10px] text-slate-500 mt-2 font-medium">${dateLabel}</div>
                `;
                chartContainer.appendChild(col);
            });

            const list = document.getElementById('mistakesList');
            list.innerHTML = '';
            
            const mistakeWordsKeys = Object.keys(appData.mistakes);
            if (mistakeWordsKeys.length === 0) {
                list.innerHTML = '<li class="text-slate-400 italic py-2 text-center">Ошибок пока нет! Вы молодец! 🎉</li>';
            } else {
                const recentMistakes = [...mistakeWordsKeys].reverse().slice(0, 30);
                recentMistakes.forEach(enWord => {
                    const wordObj = words.find(w => w.en === enWord);
                    if (wordObj) {
                        const li = document.createElement('li');
                        li.className = 'flex justify-between items-center p-2 rounded bg-white border border-slate-100 shadow-sm';
                        li.innerHTML = `<span class="font-bold text-slate-700">${wordObj.en}</span> <span class="text-slate-500 text-right ml-2">${wordObj.ru}</span>`;
                        list.appendChild(li);
                    }
                });
            }
        }

        document.getElementById('btnShowStats').onclick = () => {
            currentStatMode = appData.mode; 
            currentStatDir = appData.direction;
            statOffsetDays = 0; 
            renderStats();
            showScreen('stats');
        };

        document.getElementById('statToggleStudy').onclick = () => { currentStatMode = 'study'; renderStats(); };
        document.getElementById('statToggleTime').onclick = () => { currentStatMode = 'time'; renderStats(); };
        document.getElementById('statDirEnRu').onclick = () => { currentStatDir = 'en-ru'; renderStats(); };
        document.getElementById('statDirRuEn').onclick = () => { currentStatDir = 'ru-en'; renderStats(); };

        document.getElementById('btnChartPrev').onclick = () => {
            statOffsetDays += 7;
            renderStats();
        };

        document.getElementById('btnChartNext').onclick = () => {
            if (statOffsetDays >= 7) {
                statOffsetDays -= 7;
                renderStats();
            }
        };

        function updateMenuButtons() {
            const btnClasses = {
                active: 'menu-btn py-3 px-2 rounded-xl border-2 border-blue-500 bg-blue-50 text-blue-700 font-medium transition text-sm sm:text-base',
                inactive: 'menu-btn py-3 px-2 rounded-xl border-2 border-slate-200 bg-white text-slate-600 font-medium transition hover:bg-slate-50 text-sm sm:text-base'
            };

            document.getElementById('optDirEnRu').className = appData.direction === 'en-ru' ? btnClasses.active : btnClasses.inactive;
            document.getElementById('optDirRuEn').className = appData.direction === 'ru-en' ? btnClasses.active : btnClasses.inactive;
            
            document.getElementById('optModeStudy').className = appData.mode === 'study' ? btnClasses.active : btnClasses.inactive;
            document.getElementById('optModeTime').className = appData.mode === 'time' ? btnClasses.active : btnClasses.inactive;
            
            updateInGameScore();
        }

        document.getElementById('optDirEnRu').onclick = () => { appData.direction = 'en-ru'; saveSettings(); updateMenuButtons(); };
        document.getElementById('optDirRuEn').onclick = () => { appData.direction = 'ru-en'; saveSettings(); updateMenuButtons(); };
        document.getElementById('optModeStudy').onclick = () => { appData.mode = 'study'; saveSettings(); updateMenuButtons(); };
        document.getElementById('optModeTime').onclick = () => { appData.mode = 'time'; saveSettings(); updateMenuButtons(); };

        loadSettings();
        showScreen('start');

    </script>
</body>
</html>
